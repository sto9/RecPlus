<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://nurunchu.com/recplus/" />
    <title>rec+ は移転しました</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #1e293b;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 1rem;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        padding: 2rem 2.5rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .logo {
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      .logo span {
        color: #7c3aed;
      }
      h1 {
        font-size: 1.125rem;
        margin: 1rem 0 0.5rem;
      }
      a {
        color: #7c3aed;
        font-weight: 700;
        font-size: 1.125rem;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">rec<span>+</span></div>
      <h1>移転しました</h1>
      <a href="https://nurunchu.com/recplus/">https://nurunchu.com/recplus/</a>
    </div>
  </body>
</html>
